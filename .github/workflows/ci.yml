name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # 按包串行执行：避免共享契约构建与测试竞态，失败时也能直接定位应用。
      - name: Test RPC contracts
        run: pnpm --filter @studycommit/rpc-contracts test:run
      - name: Test design tokens
        run: pnpm --filter @studycommit/design-tokens test:run
      - name: Test observability
        run: pnpm --filter @studycommit/observability test:run
      - name: Test shared package
        run: pnpm --filter @studycommit/common test:run
      - name: Test API unit suite
        run: pnpm --filter @studycommit/api test:run
      - name: Test mini program
        run: pnpm --filter @studycommit/miniprogram test:run
      - name: Test mobile app
        run: pnpm --filter @studycommit/mobile test:run
      - run: pnpm --filter @studycommit/api build
      - run: pnpm --filter @studycommit/desktop build
      - name: Check mini program when present
        if: hashFiles('apps/miniprogram/package.json') != ''
        run: pnpm --filter @studycommit/miniprogram check

  api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: studycommit_test
          POSTGRES_USER: studycommit
          POSTGRES_PASSWORD: studycommit_test_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U studycommit -d studycommit_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      NODE_ENV: test
      API_PORT: 3001
      DATABASE_URL: postgresql://studycommit:studycommit_test_only@localhost:5433/studycommit_test
      REDIS_URL: redis://localhost:6380
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @studycommit/api db:migrate
      - run: pnpm --filter @studycommit/api test:integration
      - run: pnpm --filter @studycommit/api test:e2e
